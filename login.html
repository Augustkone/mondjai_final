{% extends "base.html" %}
{% block title %}Connexion - Mondjai{% endblock %}
{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="auth-logo__icon">&#128176;</span>
      <span class="auth-logo__text">Mond<strong>jai</strong></span>
    </div>
    <h1 class="auth-title">Connexion</h1>
    <p class="auth-sub">Accedez a votre carnet de depenses</p>
    <form method="POST" class="auth-form">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input type="email" id="email" name="email" class="form-input"
               placeholder="votre@email.com" required value="{{ request.form.email or '' }}" />
      </div>
      <div class="form-group">
        <label class="form-label" for="mot_de_passe">Mot de passe</label>
        <input type="password" id="mot_de_passe" name="mot_de_passe"
               class="form-input" placeholder="••••••••" required />
        <a href="{{ url_for('mot_de_passe_oublie') }}" class="forgot-link">Mot de passe oublie ?</a>
      </div>
      <button type="submit" class="btn btn--primary btn--full">Se connecter</button>
    </form>
    <p class="auth-link">Pas encore de compte ? <a href="{{ url_for('register') }}">Creer un compte</a></p>
  </div>
</div>
{% endblock %}
