{% extends "base.html" %}
{% block title %}Modifier - Mondjai{% endblock %}
{% block content %}
<div class="page-header">
  <div><h1 class="page-title">Modifier la depense</h1><p class="page-subtitle">#{{ dep.id }}</p></div>
  <a href="{{ url_for('historique') }}" class="btn btn--ghost">Retour</a>
</div>
<div class="form-container">
  <form method="POST" class="expense-form">
    <div class="form-group">
      <label class="form-label" for="montant">Montant (FCFA) *</label>
      <div class="input-wrap">
        <span class="input-prefix">FCFA</span>
        <input type="number" id="montant" name="montant" class="form-input input--with-prefix"
               value="{{ dep.montant }}" min="1" step="any" required />
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Categorie *</label>
      <div class="cat-radio-grid">
        {% for cat in categories %}
        <label class="cat-radio">
          <input type="radio" name="categorie_id" value="{{ cat.id }}"
                 {% if dep.categorie_id == cat.id %}checked{% endif %} required />
          <span class="cat-radio__box">
            <span class="cat-radio__icone">{{ cat.icone }}</span>
            <span class="cat-radio__nom">{{ cat.nom }}</span>
          </span>
        </label>
        {% endfor %}
      </div>
    </div>
    <div class="form-group">
      <label class="form-label" for="description">Description</label>
      <input type="text" id="description" name="description" class="form-input"
             value="{{ dep.description or '' }}" maxlength="255" />
    </div>
    <div class="form-group">
      <label class="form-label" for="date_depense">Date *</label>
      <input type="date" id="date_depense" name="date_depense" class="form-input"
             value="{{ dep.date_depense }}" required />
    </div>
    <button type="submit" class="btn btn--primary btn--full">Enregistrer les modifications</button>
  </form>
</div>
{% endblock %}
