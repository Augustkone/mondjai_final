{% extends "base.html" %}
{% block title %}Inscription - Mondjai{% endblock %}
{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="auth-logo__icon">&#128176;</span>
      <span class="auth-logo__text">Mond<strong>jai</strong></span>
    </div>
    <h1 class="auth-title">Creer un compte</h1>
    <p class="auth-sub">Commencez a suivre vos depenses</p>
    <form method="POST" class="auth-form">
      <div class="form-group">
        <label class="form-label" for="nom">Nom complet</label>
        <input type="text" id="nom" name="nom" class="form-input"
               placeholder="Kouassi Aya" required value="{{ request.form.nom or '' }}" />
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input type="email" id="email" name="email" class="form-input"
               placeholder="votre@email.com" required value="{{ request.form.email or '' }}" />
      </div>
      <div class="form-group">
        <label class="form-label" for="mot_de_passe">Mot de passe</label>
        <input type="password" id="mot_de_passe" name="mot_de_passe"
               class="form-input" placeholder="Min. 4 caracteres" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="mot_de_passe2">Confirmer</label>
        <input type="password" id="mot_de_passe2" name="mot_de_passe2"
               class="form-input" placeholder="Repetez le mot de passe" required />
      </div>
      <button type="submit" class="btn btn--primary btn--full">Creer mon compte</button>
    </form>
    <p class="auth-link">Deja un compte ? <a href="{{ url_for('login') }}">Se connecter</a></p>
  </div>
</div>
{% endblock %}
