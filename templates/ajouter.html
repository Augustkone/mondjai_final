{% extends "base.html" %}
{% block title %}Ajouter - Mondjai{% endblock %}
{% block content %}
<div class="page-header">
  <div><h1 class="page-title">Nouvelle depense</h1></div>
  <a href="{{ url_for('index') }}" class="btn btn--ghost">Retour</a>
</div>
<div class="form-container">
  <form method="POST" class="expense-form" novalidate>
    <div class="form-group">
      <label class="form-label" for="montant">Montant (FCFA) *</label>
      <div class="input-wrap">
        <span class="input-prefix">FCFA</span>
        <input type="number" id="montant" name="montant" class="form-input input--with-prefix"
               placeholder="0" min="1" step="any" required value="{{ request.form.montant or '' }}" />
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Categorie *</label>
      <div class="cat-radio-grid">
        {% for cat in categories %}
        <label class="cat-radio">
          <input type="radio" name="categorie_id" value="{{ cat.id }}"
                 {% if request.form.categorie_id == cat.id|string %}checked{% endif %} required />
          <span class="cat-radio__box">
            <span class="cat-radio__icone">{{ cat.icone }}</span>
            <span class="cat-radio__nom">{{ cat.nom }}</span>
          </span>
        </label>
        {% endfor %}
      </div>
    </div>
    <div class="form-group">
      <label class="form-label" for="description">Description (optionnel)</label>
      <input type="text" id="description" name="description" class="form-input"
             placeholder="Ex : Courses au marche..." maxlength="255"
             value="{{ request.form.description or '' }}" />
    </div>
    <div class="form-group">
      <label class="form-label" for="date_depense">Date *</label>
      <input type="date" id="date_depense" name="date_depense" class="form-input"
             value="{{ request.form.date_depense or aujourd_hui }}" required />
    </div>
    <button type="submit" class="btn btn--primary btn--full">Enregistrer la depense</button>
  </form>
</div>
{% endblock %}
